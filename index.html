<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LambOS</title>

    <link rel="icon" type="image/x-icon" href="./favicon.png" />

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/desktop.css" />
    <link rel="stylesheet" href="./styles/icons.css" />
    <link rel="stylesheet" href="./styles/taskbar.css" />
    <link rel="stylesheet" href="./styles/start-menu.css">
    <link rel="stylesheet" href="./styles/drag-drop.css">
    <link rel="stylesheet" href="./styles/context-menu.css">
  </head>

  <body>
    <!-- Escritorio -->
    <section class="desktop__container">
      <!-- Iconos del escritorio-->
      <div class="desktop__icons">
        <div class="icon">
          <img src="./src/icons/control-panel__ico.svg" alt="Control Panel" />
          <span>Control Panel</span>
        </div>

        <div class="icon">
          <img src="./src/icons/desktop__ico.svg" alt="My Computer" />
          <span>My Computer</span>
        </div>

        <div class="icon">
          <img src="./src/icons/documents__ico.svg" alt="My Documents" />
          <span>My Documents</span>
        </div>

        <div class="icon">
          <img src="./src/icons/recycle-bin__ico.svg" alt="Recycle Bin" />
          <span>Recycle Bin</span>
        </div>
      </div>

      <!-- Barra de Tareas -->
      <nav class="desktop__taskbar">
        <div class="start-btn">
          <img src="./src/icons/windows__ico.svg" alt="Start Menu" />
          <span>Start</span>
        </div>
      </nav>
    </section>
    <script src="./scripts/start-menu.js"></script>
    <script src="./scripts/drag-drop.js"></script>
    <script src="./scripts/context-menu.js"></script>
  </body>
</html>
